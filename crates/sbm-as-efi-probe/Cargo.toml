[package]
name = "sbm-as-efi-probe"
description = "EFI protocol probe for the U-Boot proof of concept. Not a boot manager."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "sbm-as-efi-probe"
path = "src/probe.rs"
required-features = ["uefi-app"]

[[bin]]
name = "sbm-as-chain-target"
path = "src/chain.rs"
required-features = ["uefi-app"]

[features]
uefi-app = ["dep:uefi"]

[dependencies]
uefi = { version = "=0.41.0", optional = true, default-features = false, features = ["alloc", "global_allocator", "logger", "panic_handler"] }
